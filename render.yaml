services:
  - type: web
    name: football-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: SEASON
        value: "2026"
      - key: NODE_VERSION
        value: "20"
